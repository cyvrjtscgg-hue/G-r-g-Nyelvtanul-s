<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Görög nyelvtanulás</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#17171c}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 18px 28px}
.top{display:flex;align-items:center;gap:12px}
.back{border:0;background:white;border-radius:14px;width:48px;height:48px;font-size:28px;box-shadow:0 2px 10px #00000010}
.progress{height:10px;background:#e7e7ee;border-radius:20px;flex:1;overflow:hidden}
.bar{height:100%;width:10%;background:#58c87a;border-radius:20px;transition:width .25s}
.stats{display:flex;justify-content:space-between;margin:16px 2px 6px;font-weight:800;font-size:18px}
.card{background:white;border-radius:24px;padding:28px 22px;margin-top:18px;box-shadow:0 6px 22px #0000000d;text-align:center}
.tag{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-bottom:16px}
.question{font-size:18px}
.greek{font-size:42px;font-weight:800;margin:10px 0}
.pron{color:#777;font-size:17px}
.listen{margin-top:16px;border:0;background:#f0f2f7;border-radius:14px;padding:12px 17px;font-weight:800;font-size:16px}
.answers{display:grid;gap:12px;margin-top:24px}
.answer{border:2px solid #dedee7;background:white;border-radius:16px;padding:17px;font-size:17px;font-weight:700;text-align:left}
.answer.correct{border-color:#4acb73;background:#effbf3}
.answer.wrong{border-color:#ef6666;background:#fff1f1}
.answer:disabled{opacity:1}
.feedback{min-height:30px;margin-top:16px;font-weight:800}
.next{display:none;margin-top:12px;width:100%;border:0;border-radius:16px;padding:17px;background:#58c87a;color:white;font-size:18px;font-weight:800}
.footer{text-align:center;color:#888;font-size:13px;padding-top:20px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" type="button" id="back">‹</button>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="stats">
    <span id="xp">⭐ 0 XP</span>
    <span id="hearts">❤️❤️❤️❤️❤️</span>
  </div>

  <div class="card">
    <div class="tag" id="tag">1. lecke · Köszönések</div>
    <div class="question">Mit jelent?</div>
    <div class="greek" id="greek">Γεια σου!</div>
    <div class="pron" id="pron">„já szu”</div>

    <button class="listen" type="button" id="listen">🔊 Meghallgatom</button>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" type="button" id="next">Tovább →</button>
  </div>

  <div class="footer">🇬🇷 Görög nyelvtanulás · 1. pálya</div>
</div>

<script>
(function(){
  "use strict";

  const questions = [
    {g:"Γεια σου!", p:"„já szu”", a:["Jó éjszakát","Szia!","Köszönöm","Jó reggelt"], ok:1},
    {g:"Καλημέρα!", p:"„kaliméra”", a:["Szia!","Jó éjszakát","Jó reggelt!","Köszönöm"], ok:2},
    {g:"Καλησπέρα!", p:"„kaliszpéra”", a:["Jó estét!","Jó reggelt!","Viszlát!","Köszönöm"], ok:0},
    {g:"Καληνύχτα!", p:"„kaliníhta”", a:["Szia!","Jó éjszakát!","Jó reggelt!","Köszönöm"], ok:1},
    {g:"Ευχαριστώ!", p:"„efharisztó”", a:["Köszönöm!","Kérem!","Szia!","Jó estét!"], ok:0},
    {g:"Παρακαλώ!", p:"„parakaló”", a:["Viszlát!","Kérem! / Szívesen!","Jó éjszakát!","Nem"], ok:1},
    {g:"Αντίο!", p:"„adío”", a:["Szia!","Köszönöm!","Viszlát!","Jó reggelt!"], ok:2},
    {g:"Ναι!", p:"„ne”", a:["Nem!","Igen!","Köszönöm!","Kérem!"], ok:1},
    {g:"Όχι!", p:"„óhi”", a:["Igen!","Nem!","Szia!","Viszlát!"], ok:1},
    {g:"Τι κάνεις;", p:"„ti kánisz?”", a:["Hogy vagy? / Mit csinálsz?","Honnan jössz?","Mi a neved?","Jó éjszakát!"], ok:0}
  ];

  let index = 0;
  let xp = 0;
  let hearts = 5;
  let answered = false;

  const $ = id => document.getElementById(id);
  const answersBox = $("answers");

  function render(){
    const q = questions[index];
    $("tag").textContent = (index + 1) + ". lecke · Köszönések";
    $("greek").textContent = q.g;
    $("pron").textContent = q.p;
    $("xp").textContent = "⭐ " + xp + " XP";
    $("hearts").textContent = "❤️".repeat(hearts) + "🖤".repeat(5-hearts);
    $("bar").style.width = (((index + 1) / questions.length) * 100) + "%";
    $("feedback").textContent = "";
    $("next").style.display = "none";
    answered = false;
    answersBox.innerHTML = "";

    q.a.forEach((text, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "answer";
      b.textContent = text;
      b.addEventListener("click", () => choose(i, b));
      answersBox.appendChild(b);
    });
  }

  function choose(i, button){
    if(answered) return;
    const q = questions[index];

    if(i === q.ok){
      answered = true;
      button.classList.add("correct");
      xp += 10;
      $("xp").textContent = "⭐ " + xp + " XP";
      $("feedback").textContent = "🎉 Helyes! +10 XP";
      [...answersBox.children].forEach(b => b.disabled = true);
      $("next").style.display = "block";
    }else{
      button.classList.add("wrong");
      hearts = Math.max(0, hearts - 1);
      $("hearts").textContent = "❤️".repeat(hearts) + "🖤".repeat(5-hearts);
      $("feedback").textContent = "❌ Nem ez. Próbáld újra!";
      setTimeout(() => button.classList.remove("wrong"), 500);
    }
  }

  $("next").addEventListener("click", function(){
    if(index < questions.length - 1){
      index++;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    }else{
      $("tag").textContent = "🎉 Lecke kész!";
      $("question").textContent = "";
      $("greek").textContent = "Μπράβο!";
      $("pron").textContent = "„brávo!” — Ügyes!";
      $("answers").innerHTML = "";
      $("feedback").textContent = "Megcsináltad a köszönések első pályáját!";
      $("next").style.display = "none";
      $("bar").style.width = "100%";
    }
  });

  $("listen").addEventListener("click", function(){
    if("speechSynthesis" in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(questions[index].g);
      u.lang = "el-GR";
      u.rate = 0.78;
      speechSynthesis.speak(u);
    }
  });

  $("back").addEventListener("click", function(){
    if(index > 0){ index--; render(); }
  });

  render();
})();
</script>
</body>
</html>
